repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.svg$|\.ipynb$'
      - id: trailing-whitespace
        exclude: '\.svg$|\.ipynb$'
      - id: detect-private-key
      - id: check-yaml
        exclude: '^mkdocs\.yml$|(^|/)recipe/'
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
        exclude: '^benchmarks/'
      - id: ruff-format
        types_or: [python, pyi]
        exclude: '^benchmarks/'
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        exclude: '^benchmarks/'
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd rust && cargo fmt --all --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd rust && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
