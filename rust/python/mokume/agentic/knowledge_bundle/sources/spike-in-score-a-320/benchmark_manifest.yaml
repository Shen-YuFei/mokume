version: 3

truth_sources:
  ups1:
    type: ups1
    reference_fasta: /data/shenyufei/Bigbio_data/fasta/Yeast_UPS1_UniversalContaminants.fasta
    source_url: https://www.sigmaaldrich.com/ups

search_space:
  contract_id: spike-in-score-a-320-v5
  random_seed: 42
  quantification: [directlfq, maxlfq, pibaq, sum, top3]
  normalization: [none, median]
  imputation: [none, mindet, minprob, knn, seqknn, impseq, impseqrob, qrilc]
  de_method: [limma, rots, deqms, limrots]
  log2fc_threshold: [0.5]
  fdr_method: [bh]

projects:
  PXD000279:
    project_accession: PXD000279
    setting: LFQ
    sdrf: PXD000279/PXD000279.sdrf.tsv
    converter: openms-consensus
    consensusxml: PXD000279/quantms/quant_tables/PXD000279.sdrf_openms_design_openms.consensusXML
    fasta: /data/shenyufei/Bigbio_data/fasta/uniprotkb_proteome_HYE_UniversalContaminants.fasta
    factor_column: factor value[spiked compound]
    condition_map:
      "CT=spike-in;CN=Escherichia coli;CR=10% E.coli": Ecoli10
      "CT=spike-in;CN=Escherichia coli;CR=30% E.coli": Ecoli30
    benchmark:
      contrasts:
        - id: ecoli30_vs_ecoli10
          group1: Ecoli30
          group2: Ecoli10
          expected_direction: UP
          expected_log2fc: 1.584962500721156
      design_family: organism
      dataset_url: https://proteomecentral.proteomexchange.org/dataset/PXD000279
      design_source_file: benchmark_inputs/PXD000279/experimentalDesign.txt
      ground_truth:
        file: benchmark_inputs/PXD000279/ground_truth.tsv
        entity_count: 4588
        source: {type: fasta_taxon, taxonomy_id: 83333}

