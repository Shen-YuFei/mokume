      mean_lodo_rank_spearman: 0.639
    limitations:
      - Candidate preset has not been published as a Mokume default.
      - Benchmark data are 12 CPTAC clinical TMT cohorts compared tumor versus normal, quantified by Mokume
        from CDAP PSM reports with RefSeq proteins mapped to genes.
      - There is no per-gene truth; a configuration is scored by how well its calls and log2FC agree between
        two halves of the plexes of a study, after a gate of at most 1% false-positive calls on null contrasts.
      - Only limma and DEqMS were run; ROTS and LimROTS were not evaluated in this cohort.
      - Configurations with batch correction or a protein filter are left out because the service cannot
        run them; overall_best_config, the best configuration with them included, uses IRS across plexes.
      - Quantification is frozen when the workflow starts from a protein matrix.
      - Held-out transfer is weak; most held-out studies had a configuration that scored clearly better.
      - The CompRef cohort (cptac-compref-preset) also selected maxlfq but none of the other choices.
