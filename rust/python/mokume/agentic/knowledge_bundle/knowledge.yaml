  - id: cptac-compref-preset
    source_id: cptac-mokumebench
    kind: setting_preset
    status: candidate_for_review
    confidence: moderate
    priority: 12
    eligible_as_prior: true
    applicability:
      data_type: TMT
      setting: CDAP_TMT_CompRef
      upstream_engine: null
      quantification: null
    reference_profile:
      projects: [PDC000290, PDC000292, PDC000293, PDC000242, PDC000124, PDC000129, PDC000154, PDC000203,
        PDC000495, PDC000440, PDC000447, PDC000555]
      n_proteins: [6036, 10084]
      n_samples: [20, 54]
      missing_rate: [0.049981, 0.228661]
    pipeline:
      quantification: maxlfq
      normalization: median
      imputation: impseqrob
      de_method: limrots
      fdr_method: bh
      log2fc_threshold: 0.584963
      ensemble: none
      ensemble_k: null
    metrics:
      studies: 12
      candidates_per_study: 1488
      service_candidates_per_study: 310
      gated_service_candidates: 310
      fp_gate: 0.01
      mean_fp_rate: 9.0e-06
      mean_f1: 0.7692
      mean_spearman: 0.8666
      mean_study_deficit: 0.0072
      median_study_deficit: 0.0081
      iqr_study_deficit: 0.0035
      near_best: 0.01
      near_best_rate: 0.8333
      tied_at_best: 1
      position_in_general_ranking: 1
      general_ranking_size: 310
      overall_best_config: maxlfq|median|impseq|combat|half|limma
      lodo_unit: study
      lodo_folds: 12
      lodo_folds_selecting_preset: 9
      lodo_near_best_rate: 0.8333
      mean_lodo_regret: 0.007668
      max_lodo_regret: 0.01581
      mean_lodo_rank_spearman: 0.873
    limitations:
      - Candidate preset has not been published as a Mokume default.
      - Benchmark data are the 12 isobaric CPTAC CompRef studies (basal-like and luminal breast cancer
        xenograft reference samples), quantified by Mokume from CDAP PSM reports with RefSeq proteins
        mapped to genes.
      - There is no per-gene truth; a configuration is scored by how well its calls and log2FC agree with
        the same configuration on the other studies, after a gate of at most 1% false-positive calls on
        null contrasts.
      - Configurations with batch correction or a protein filter are left out because the service cannot
        run them; overall_best_config is the best configuration with them included.
      - Quantification is frozen when the workflow starts from a protein matrix.
      - The clinical cohort (cptac-clinical-preset) also selected maxlfq but none of the other choices.
