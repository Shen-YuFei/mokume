      - Candidate preset has not been published as a Mokume default.
      - Benchmark DDA data were searched and quantified with quantms and converted to QPX.
      - Quantification is frozen when the workflow starts from a protein matrix.
      - Many configurations fall within the study-bootstrap interval of this preset, and on held-out studies
        it was rarely within 0.01 of the best deficit.
      - DirectLFQ normalizes samples internally; where many proteins change in one direction (PXD000279),
        maxlfq or DirectLFQ without sample normalization (mokume --directlfq-no-sample-normalization)
        scored far higher.
      - Imputation choice matters for UPS spike-ins with few changing proteins (PXD001819, PXD002099).
