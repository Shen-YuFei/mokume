[workspace]
resolver = "2"
members = [
    "crates/mokume-cli",
    "crates/mokume-core",
    "crates/mokume-golden-tests",
    "crates/mokume-imputation",
    "crates/mokume-io",
    "crates/mokume-normalization",
    "crates/mokume-pipeline",
    "crates/mokume-py",
    "crates/mokume-quant",
    "crates/mokume-stats",
]
default-members = ["crates/mokume-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bigbio/mokume"
authors = ["BigBio maintainers"]
description = "Rust-native proteomics quantification toolkit for quantms/QPX data"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
