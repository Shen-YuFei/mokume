# maturin build backend: compiles the `mokume-py` PyO3 crate into the
# `mokume._mokume` extension and packages it together with the Python source
# under `python/mokume/` into a `pip install mokume-rs` wheel (import name stays
# `mokume`, but the API surface differs from the pure-Python `mokume` package).
# The standalone Rust CLI binary (`crates/mokume-cli`) is built separately with
# cargo.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mokume-rs"
description = "Proteomics quantification toolkit: a Rust compute kernel with a Python periphery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yufei Shen" }]
keywords = [
    "proteomics",
    "mass-spectrometry",
    "quantification",
    "ibaq",
    "differential-expression",
    "bioinformatics",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

# `pip install mokume-rs` exposes the `mokume` command; it runs the same compute
# kernel in-process through the extension (no separate binary needed).
[project.scripts]
mokume = "mokume.__main__:main"

[project.urls]
Repository = "https://github.com/bigbio/mokume"
Issues = "https://github.com/bigbio/mokume/issues"

# Third-party stacks the pure-Python periphery commands (mokume.commands.*) need.
# The compute path (the mokume._mokume extension) needs none of these; install
# only the extra for the periphery command you run, e.g.
# pip install mokume-rs[plotting].
[project.optional-dependencies]
plotting = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "scikit-learn"]
reports = ["numpy", "pandas", "plotly"]
tissuemap = [
    "numpy",
    "pandas",
    "scipy",
    "scanpy",
    "anndata",
    "umap-learn",
    "combat",
    "matplotlib",
    "seaborn",
    "pyarrow",
]
ibaq = ["numpy", "pandas", "scipy", "pyopenms", "pyarrow", "PyYAML"]
# QC / workflow-comparison reports + the pure-Python method fallback
# (missforest imputation) the Rust kernel does not reproduce.
analysis = ["numpy", "pandas", "scipy", "scikit-learn"]
all = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "plotly",
    "scanpy",
    "anndata",
    "umap-learn",
    "combat",
    "pyopenms",
    "pyarrow",
    "PyYAML",
]

[tool.maturin]
# Build the PyO3 binding crate (not the whole workspace) and place the compiled
# extension at `mokume._mokume`; the Python package lives under `python/mokume/`.
manifest-path = "crates/mokume-py/Cargo.toml"
module-name = "mokume._mokume"
python-source = "python"

[tool.pylint.design]
# Scientific code: dataclasses aggregate many fields, helper functions take many
# tabular inputs, and analysis pipelines accumulate intermediates. The library
# defaults (5 / 7 / 15) are too tight for the periphery commands. Mirrors the
# upstream mokume package this periphery code was factored out of.
max-args = 6
max-attributes = 25
max-locals = 18
max-positional-arguments = 6

[tool.pylint."MESSAGES CONTROL"]
# C0114/0115/0116: missing module/class/function docstrings — covered by the
# documentation policy. The three behavioural checks match the upstream mokume
# package's .pylintrc.
disable = [
    "C0114",
    "C0115",
    "C0116",
    "arguments-differ",
    "unexpected-keyword-arg",
    "no-value-for-parameter",
]

[tool.bandit.assert_used]
# pytest test files use `assert` by design; B101 (assert stripped under `python
# -O`) is a production-code concern, not a test-code one.
skips = ["*/tests/*", "tests/*"]
