---
# Codacy reads this from the repository root. The previous copy lived in
# `python/`, where Codacy never looked, so none of its rules were in effect.
#
# Test trees are excluded at the top level rather than per engine: a per-engine
# `exclude_paths` only silences that one engine, so excluding tests from bandit
# and opengrep still left pylint reporting missing docstrings on every test
# function. Test code follows different conventions from production code --
# bare asserts, fixtures that shadow their own names, no docstrings -- and the
# repository's own pre-commit and pylint gates still cover it locally.
# See issue #52.
engines:
  pylint:
    options:
      disable: "arguments-differ,unexpected-keyword-arg,no-value-for-parameter"
  markdownlint:
    options:
      MD013: false
      MD046: false
exclude_paths:
  - "docs/spec/**"
  - ".github/workflows/**"
  - "python/tests/**"
  - "rust/tests/**"
  - "rust/crates/*/tests/**"
  - "benchmarks/*/scripts/**"
  # A whole crate of golden tests: its only source file is test code.
  - "rust/crates/mokume-golden-tests/**"
