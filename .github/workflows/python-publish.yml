# Publish the pure-Python `mokume-py` distribution. The default `mokume`
# distribution is built from `rust/` by `rust-publish.yml`.
name: Publish mokume-py

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install build frontend
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build package
      run: python -m build

    - name: Verify distribution metadata
      run: |
        python -m pip install --no-deps dist/*.whl
        python -c "import importlib.metadata as m; from packaging.requirements import Requirement; requirements=[Requirement(value) for value in m.requires('mokume-py') or []]; pyopenms=[value for value in requirements if value.name.lower() == 'pyopenms']; print(m.version('mokume-py'), pyopenms); assert len(pyopenms) == 1 and pyopenms[0].marker is None; assert not any(value.marker and 'pibaq' in str(value.marker) for value in requirements)"

    - name: Publish package to PyPI
      # The token must be account-scoped or authorized for the new mokume-py
      # project; a token restricted to the existing mokume project cannot work.
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: python/dist
