# You can use this file to create a conda environment for this pipeline:
#   conda env create -f environment.yml
name: mokume
channels:
  - openms
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - scikit-learn
  - pyopenms >=3.4,<4
  - numpy<2.3.0
  - click
  - pandas
  - matplotlib
  - pyarrow>=16.1.0
  - duckdb>=0.10.2
  - qnorm
  - scipy>=1.10
  - joblib
  - seaborn>=0.13.2
  - typing_extensions>=4.6.3
  - inmoose
  - anndata
  - plotly
  - statsmodels
